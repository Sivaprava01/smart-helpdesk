[project]
name = "smart-helpdesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sivaprava01", email = "sivaprava2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.1",
    "bcrypt>=5.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.38",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
smart-helpdesk = "smart_helpdesk:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

